services:
  llamafactory:
    image: hiyouga/llamafactory:latest
    container_name: llamafactory-trainer
    volumes:
      - D:/PrivScan/docker-live-models:/workspace/models
      - ./training-data:/workspace/data
      - ./output:/workspace/output
      - ./configs:/workspace/configs
      - ./scripts:/workspace/scripts
      - ./listen.py:/workspace/listen.py:ro
      - ./Responses_41426:/workspace/Responses_41426:ro
    working_dir: /workspace
    ports:
      - "7860:7860"  # WebUI
    environment:
      - CUDA_VISIBLE_DEVICES=0
      - GRADIO_SERVER_NAME=0.0.0.0
    command: llamafactory-cli webui
    stdin_open: true
    tty: true
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    networks:
      - llama-network

  ollama:
    image: ollama/ollama:latest
    container_name: ollama-server
    volumes:
      - D:/PrivScan/docker-live-models:/models
      - D:/PrivScan/docker-live-ollama:/root/.ollama
    ports:
      - "11434:11434"
    environment:
      - OLLAMA_HOST=0.0.0.0
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    networks:
      - llama-network

  model-downloader:
    image: python:3.11-slim
    container_name: llama-model-downloader
    volumes:
      - D:/PrivScan/docker-live-models:/models
      - ./scripts:/scripts
    working_dir: /scripts
    environment:
      - HF_TOKEN=inserttokenhere
    command: >
      bash -c "
        pip install -q huggingface-hub transformers &&
        python download_model.py
      "
    profiles:
      - setup
    networks:
      - llama-network

networks:
  llama-network:
    driver: bridge
